<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年齢計算くん - 便利ツール集</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #fce4ec;
            /* 懐かしのパステルピンク */
            color: #4e342e;
            font-family: "MS PGothic", "MS Pゴシック", sans-serif;
            margin: 20px;
        }

        .container {
            width: 700px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 3px double #f06292;
            padding: 15px;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ffffff;
            background-color: #f06292;
            padding: 5px;
            font-size: 20px;
            text-align: center;
            margin: -15px -15px 15px -15px;
            border-bottom: 2px solid #880e4f;
        }

        .main-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .main-table td {
            border: 1px solid #f8bbd0;
            padding: 10px;
        }

        .label {
            background-color: #fdf0f5;
            font-weight: bold;
            width: 150px;
            font-size: 13px;
        }

        .result-box {
            background-color: #fff9fb;
            border: 1px inset #f06292;
            padding: 15px;
            margin-top: 10px;
        }

        .age-num {
            font-size: 32px;
            font-weight: bold;
            color: #d81b60;
            font-family: 'Comic Sans MS', cursive;
            /* 当時のWeb風 */
        }

        .sub-info {
            font-size: 12px;
            margin-top: 5px;
        }

        .eto-img {
            float: right;
            border: 1px solid #ccc;
            padding: 5px;
            background: #fff;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            border-top: 1px dotted #999999;
            padding-top: 10px;
        }

        a {
            color: #d81b60;
        }

        input[type="date"] {
            font-family: inherit;
            border: 1px solid #f06292;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐾 年齢計算くん (Age & Profile)</h1>

        <div id="root"></div>

        <div class="footer">
            [ <a href="https://00portal.kotojisamadake-tool.workers.dev/">便利ツール集ポータルへ戻る</a> ]
        </div>
    </div>

    <script type="text/babel">
        const ETO = ['子(ね)', '丑(うし)', '寅(とら)', '卯(うさぎ)', '辰(たつ)', '巳(へび)', '午(うま)', '未(ひつじ)', '申(さる)', '酉(とり)', '戌(いぬ)', '亥(い)'];
        const ZODIAC = [
            { name: '山羊座', start: [1, 1], end: [1, 19] }, { name: '水瓶座', start: [1, 20], end: [2, 18] },
            { name: '魚座', start: [2, 19], end: [3, 20] }, { name: '牡羊座', start: [3, 21], end: [4, 19] },
            { name: '牡牛座', start: [4, 20], end: [5, 20] }, { name: '双子座', start: [5, 21], end: [6, 21] },
            { name: '蟹座', start: [6, 22], end: [7, 22] }, { name: '獅子座', start: [7, 23], end: [8, 22] },
            { name: '乙女座', start: [8, 23], end: [9, 22] }, { name: '天秤座', start: [9, 23], end: [10, 23] },
            { name: '蠍座', start: [10, 24], end: [11, 22] }, { name: '射手座', start: [11, 23], end: [12, 21] },
            { name: '山羊座', start: [12, 22], end: [12, 31] },
        ];

        const App = () => {
            const [birthDate, setBirthDate] = React.useState('');
            const [result, setResult] = React.useState(null);

            React.useEffect(() => {
                if (!birthDate) return;
                const birth = new Date(birthDate);
                const today = new Date();

                let age = today.getFullYear() - birth.getFullYear();
                const m = today.getMonth() - birth.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;

                const diffTime = Math.abs(today - birth);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                const eto = ETO[(birth.getFullYear() - 4) % 12];

                const md = (birth.getMonth() + 1) * 100 + birth.getDate();
                const zodiac = ZODIAC.find(z => {
                    const s = z.start[0] * 100 + z.start[1];
                    const e = z.end[0] * 100 + z.end[1];
                    return md >= s && md <= e;
                })?.name || '山羊座';

                setResult({ age, diffDays, eto, zodiac });
            }, [birthDate]);

            return (
                <div>
                    <table class="main-table">
                        <tr>
                            <td class="label">あなたの生年月日</td>
                            <td>
                                <input type="date" value={birthDate} onChange={(e) => setBirthDate(e.target.value)} />
                            </td>
                        </tr>
                    </table>

                    {result && (
                        <div class="result-box">
                            <div style={{ textAlign: 'center' }}>
                                あなたは現在...<br />
                                <span class="age-num">{result.age} 歳</span> です！
                            </div>
                            <hr style={{ border: '1px dashed #f8bbd0' }} />
                            <div class="sub-info">
                                🌟 生まれてから：<b>{result.diffDays.toLocaleString()} 日目</b><br />
                                🐾 干支：<b>{result.eto}</b><br />
                                ✨ 星座：<b>{result.zodiac}</b>
                            </div>
                        </div>
                    )}
                    <div style={{ fontSize: '11px', color: '#888', marginTop: '10px' }}>
                        ※正確な年齢（満年齢）を表示しています。
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/5dfe8bfce49a43ffe78096b109972b5b"></script>
    <!-- admax -->
</body>

</html>
